[project]
name = "cidr-wildcard-pattern-matcher"
version = "0.1.0"
description = "IPv4 address matcher for legacy wildcard patterns like 192.168.*.*"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
